# SearXNG — for company_enrich search_backend: searxng
# Run from this directory: docker compose up -d
# Then set config.yaml: searxng_base_url: "http://localhost:8888"
# Or env: SEARXNG_BASE_URL=http://localhost:8888

services:
  redis:
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    networks:
      - searxng

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    networks:
      - searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/

networks:
  searxng:
    driver: bridge
